[pytest]
# Test-only settings: erp_root.settings with a reduced PBKDF2 work factor
# (see erp_root/settings_test.py). Production entry points are unaffected.
DJANGO_SETTINGS_MODULE = erp_root.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

markers =
    unit: Unit tests (no database, no external services)
    integration: Integration tests (may use database)
    e2e: End-to-end tests (full system tests)
    slow: Slow tests (skipped by default in CI)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
