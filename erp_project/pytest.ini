[pytest]
DJANGO_SETTINGS_MODULE = erp_root.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

markers =
    unit: Unit tests (no database, no external services)
    integration: Integration tests (may use database)
    e2e: End-to-end tests (full system tests)
    slow: Slow tests (skipped by default in CI)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
