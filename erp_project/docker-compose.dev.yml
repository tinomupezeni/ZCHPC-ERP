# ZCHPC ERP - Docker Compose Development Configuration
# Run with: docker-compose -f docker-compose.dev.yml up -d
#
# This configuration includes:
# - Hot-reload for Django development
# - Volume mounting for live code changes
# - Debug mode enabled

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: zchpc_erp_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp@1234
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network_dev

  # ==========================================================================
  # Django Development Server
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zchpc_erp_web_dev
    restart: unless-stopped
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - ALLOWED_HOSTS=*
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=erp_db
      - DB_USER=erp_user
      - DB_PASSWORD=erp@1234
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Exclude these from mount
      - /app/staticfiles
      - /app/mediafiles
      - /app/venv
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp_network_dev
    # Override command for development (with hot-reload)
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres_data_dev:
    name: zchpc_erp_postgres_data_dev

# ==========================================================================
# Networks
# ==========================================================================
networks:
  erp_network_dev:
    name: zchpc_erp_network_dev
    driver: bridge
